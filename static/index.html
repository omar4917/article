<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The Pitch Report — Sharp sports opinion, debate, and tactical analysis from the world of football.">
  <title>The Pitch Report — Sports Opinion & Debate</title>
  <link rel="stylesheet" href="site.css">
</head>
<body>

  <!-- ═══════ NAV ═══════ -->
  <nav class="site-nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <div class="nav-logo-icon">PR</div>
        The Pitch Report
      </a>
      <ul class="nav-links">
        <li><a href="index.html" class="active" id="nav-home">Home</a></li>
        <li><a href="admin.html" class="nav-admin-link">⚙ Admin</a></li>
      </ul>
    </div>
  </nav>

  <!-- ═══════ HERO (latest article) ═══════ -->
  <section class="hero-section" id="hero-section" style="display:none;">
    <div class="hero-inner">
      <div class="hero-content">
        <span class="hero-badge" id="hero-category"></span>
        <h1 class="hero-title" id="hero-title"></h1>
        <p class="hero-excerpt" id="hero-excerpt"></p>
        <div class="hero-meta">
          <span id="hero-author"></span>
          <span class="hero-dot">·</span>
          <span id="hero-date"></span>
          <span class="hero-dot">·</span>
          <span id="hero-read-time"></span>
        </div>
        <a href="#" class="hero-cta" id="hero-link">Read Full Article →</a>
      </div>
    </div>
  </section>

  <!-- ═══════ FILTER BAR ═══════ -->
  <div class="filter-bar" id="filter-bar" style="display:none;">
    <div class="filter-inner">
      <span class="filter-label">Filter:</span>
      <div class="filter-chips" id="filter-chips">
        <button class="filter-chip active" data-category="all">All</button>
      </div>
    </div>
  </div>

  <!-- ═══════ ARTICLES GRID ═══════ -->
  <section class="articles-section">
    <div class="articles-inner">
      <div class="articles-grid" id="articles-grid"></div>
    </div>
  </section>

  <!-- ═══════ EMPTY STATE ═══════ -->
  <div class="empty-state" id="empty-state" style="display:none;">
    <div class="empty-state-icon">📰</div>
    <h2>No Articles Yet</h2>
    <p>Head over to the <a href="admin.html">Admin Panel</a> to publish your first article.</p>
  </div>

  <!-- ═══════ FOOTER ═══════ -->
  <footer class="site-footer">
    <div class="footer-inner">
      <p>© 2025 The Pitch Report. All rights reserved.</p>
    </div>
  </footer>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="site.js"></script>
</body>
</html>
